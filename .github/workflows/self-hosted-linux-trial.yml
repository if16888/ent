name: Self-hosted Linux trial

on:
  push:
    branches:
      - test/self-hosted-linux-oracle
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-linux-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle-x64-asan-timer:
    name: Oracle self-hosted Linux X64 ASan timer stress
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      BUILD_DIR: build-self-hosted-asan-timer
      CI_LOG_DIR: ${{ github.workspace }}/ci-logs/self-hosted-asan-timer
      CMAKE_BUILD_PARALLEL_LEVEL: 1
      CTEST_PARALLEL_LEVEL: 1

    steps:
      - name: Runner diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          nproc
          free -h
          df -h
          gcc --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Clean persistent workspace outputs
        shell: bash
        run: rm -rf "$BUILD_DIR" "$CI_LOG_DIR"

      - name: Configure ASan + UBSan
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$CI_LOG_DIR"
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENT_ENABLE_LUA=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            2>&1 | tee "$CI_LOG_DIR/configure.log"

      - name: Build timer target
        shell: bash
        run: |
          set -o pipefail
          cmake --build "$BUILD_DIR" --target test_utl_timer --parallel 1 \
            2>&1 | tee "$CI_LOG_DIR/build.log"

      - name: Run timer test 20 times
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:log_path=${{ github.workspace }}/ci-logs/self-hosted-asan-timer/asan
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:log_path=${{ github.workspace }}/ci-logs/self-hosted-asan-timer/ubsan
        run: |
          set +e
          failures=0
          : > "$CI_LOG_DIR/repeats.log"
          for i in $(seq 1 20); do
            echo "=== iteration $i ===" | tee -a "$CI_LOG_DIR/repeats.log"
            "$BUILD_DIR/bin/test_utl_timer" 2>&1 | tee -a "$CI_LOG_DIR/repeats.log"
            rc=${PIPESTATUS[0]}
            echo "rc=$rc" | tee -a "$CI_LOG_DIR/repeats.log"
            if [ "$rc" -ne 0 ]; then
              failures=$((failures + 1))
            fi
          done
          echo "TIMER_STRESS_FAILURES=$failures/20" | tee -a "$CI_LOG_DIR/repeats.log"
          test "$failures" -eq 0

      - name: Final resource snapshot
        if: always()
        shell: bash
        run: |
          echo '=== memory ==='
          free -h
          echo '=== disk ==='
          df -h
          echo '=== sanitizer logs ==='
          find "$CI_LOG_DIR" -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort || true
          echo '=== recent OOM messages ==='
          dmesg 2>/dev/null | tail -100 | grep -Ei 'oom|out of memory|killed process' || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ent-self-hosted-linux-asan-timer-stress-logs
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: ignore
