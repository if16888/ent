name: ARM64 Self-hosted Validation

on:
  push:
    branches:
      - master
    paths:
      - "comm/**"
      - "inc/**"
      - "test/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - ".github/workflows/arm64-selfhosted.yml"
  pull_request:
    branches:
      - master
    paths:
      - "comm/**"
      - "inc/**"
      - "test/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - ".github/workflows/arm64-selfhosted.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-selfhosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    name: ARM64 self-hosted build and test
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 45
    env:
      BUILD_DIR: build-arm64
      CI_LOG_DIR: ${{ github.workspace }}/ci-logs/arm64
      CMAKE_BUILD_PARALLEL_LEVEL: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify ARM64 runner identity
        shell: bash
        run: |
          set -euxo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          uname -a
          arch="$(uname -m)"
          test "$arch" = "aarch64" || test "$arch" = "arm64"
          test "${RUNNER_ARCH:-}" = "ARM64"

      - name: Verify build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          command -v gcc
          command -v cmake
          command -v make
          test -f /usr/include/sqlite3.h
          test -f /usr/include/mysql/mysql.h
          test -f /usr/include/postgresql/libpq-fe.h
          echo "ENT_ENABLE_SQLITE=ON" >> "$GITHUB_ENV"
          echo "ENT_ENABLE_MYSQL=ON" >> "$GITHUB_ENV"
          echo "ENT_ENABLE_PGSQL=ON" >> "$GITHUB_ENV"
          echo "Required DB backends: SQLite=ON MySQL=ON PostgreSQL=ON"

      - name: Resource preflight
        shell: bash
        run: |
          set -euxo pipefail
          nproc
          free -h
          df -h / /tmp
          gcc --version
          cmake --version
          command -v ninja && ninja --version || true

      - name: Configure
        run: ./scripts/run-ci-linux.sh configure

      - name: Build
        run: ./scripts/run-ci-linux.sh build

      - name: Full test suite
        run: ./scripts/run-ci-linux.sh test

      - name: Timer lifecycle stress 20x
        shell: bash
        run: |
          set -euxo pipefail
          for i in $(seq 1 20); do
            echo "ARM64 timer stress iteration ${i}/20"
            "$BUILD_DIR/bin/test_utl_timer"
          done

      - name: Timer baseline and resource smoke (non-threshold)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/timer_baseline.py \
            --binary "$BUILD_DIR/bin/perf_timer_scale" \
            --output-dir "$RUNNER_TEMP/timer-baseline-smoke" \
            --trials 1 --duration-ms 350 \
            --scenario ms:1:20 --scenario ms:64:20 \
            --scenario ms:128:20 --scenario us:8:1000

      - name: Experimental timerfd comparison smoke (non-threshold)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/compare_timer_backends.py \
            --legacy-bin "$BUILD_DIR/bin/perf_timer_scale" \
            --prototype-bin "$BUILD_DIR/bin/perf_timerfd_scale" \
            --output-dir "$RUNNER_TEMP/timerfd-compare-smoke" \
            --trials 1 --duration-ms 350 \
            --scenario ms:16:20 --scenario us:4:1000

      - name: Multi-core controlled-load A/B smoke (non-threshold)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/compare_timer_backends.py \
            --legacy-bin "$BUILD_DIR/bin/perf_timer_scale" \
            --prototype-bin "$BUILD_DIR/bin/perf_timerfd_scale" \
            --output-dir "$RUNNER_TEMP/timerfd-2core-loaded-smoke" \
            --trials 1 --duration-ms 350 \
            --scenario ms:16:20 \
            --cpu-width 2 --load-duty-percent 25

      - name: Repeat pinned timer baseline (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/timer_baseline.py \
            --binary "$BUILD_DIR/bin/perf_timer_scale" \
            --output-dir "$RUNNER_TEMP/timer-baseline-arm64" \
            --trials 20 --duration-ms 1500 --pin-first-allowed

      - name: Manual paired timerfd comparison (20 trials)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/compare_timer_backends.py \
            --legacy-bin "$BUILD_DIR/bin/perf_timer_scale" \
            --prototype-bin "$BUILD_DIR/bin/perf_timerfd_scale" \
            --output-dir "$RUNNER_TEMP/timerfd-comparison-arm64" \
            --trials 20 --duration-ms 1500 --pin-first-allowed

      - name: Manual two-core and controlled-load 20-trial A/B
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/compare_timer_backends.py \
            --legacy-bin "$BUILD_DIR/bin/perf_timer_scale" \
            --prototype-bin "$BUILD_DIR/bin/perf_timerfd_scale" \
            --output-dir "$RUNNER_TEMP/timerfd-2core-no-load" \
            --trials 20 --duration-ms 1500 --cpu-width 2
          python3 scripts/compare_timer_backends.py \
            --legacy-bin "$BUILD_DIR/bin/perf_timer_scale" \
            --prototype-bin "$BUILD_DIR/bin/perf_timerfd_scale" \
            --output-dir "$RUNNER_TEMP/timerfd-2core-40pct-load" \
            --trials 20 --duration-ms 1500 \
            --cpu-width 2 --load-duty-percent 40

      - name: Upload multi-core/load benchmark evidence
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timerfd-2core-load-evidence
          path: |
            ${{ runner.temp }}/timerfd-2core-no-load
            ${{ runner.temp }}/timerfd-2core-40pct-load
          if-no-files-found: warn

      - name: Upload manual timerfd A/B dataset
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timerfd-comparison-arm64
          path: ${{ runner.temp }}/timerfd-comparison-arm64
          if-no-files-found: warn

      - name: Upload manual timer baseline dataset
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timer-baseline-arm64
          path: ${{ runner.temp }}/timer-baseline-arm64
          if-no-files-found: warn

      - name: Install and downstream consumer check
        run: ./scripts/run-ci-linux.sh install-consumer

      - name: Resource snapshot
        if: always()
        shell: bash
        run: |
          set -u
          echo '=== uname ==='
          uname -a || true
          echo '=== memory ==='
          free -h || true
          echo '=== swap ==='
          swapon --show || true
          echo '=== disk ==='
          df -h / /tmp || true
          echo '=== load ==='
          uptime || true
          echo '=== build size ==='
          du -sh "$BUILD_DIR" 2>/dev/null || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-failure-logs-arm64
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: ignore
