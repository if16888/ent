name: ARM64 Self-hosted Validation

on:
  pull_request:
    branches:
      - master
    paths:
      - "comm/**"
      - "include/**"
      - "test/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - ".github/workflows/arm64-selfhosted.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-selfhosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    name: ARM64 self-hosted build and test
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 45
    env:
      BUILD_DIR: build-arm64
      CI_LOG_DIR: ${{ github.workspace }}/ci-logs/arm64
      CMAKE_BUILD_PARALLEL_LEVEL: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify ARM64 runner identity
        shell: bash
        run: |
          set -euxo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          uname -a
          arch="$(uname -m)"
          test "$arch" = "aarch64" || test "$arch" = "arm64"
          test "${RUNNER_ARCH:-}" = "ARM64"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libsqlite3-dev \
            default-libmysqlclient-dev \
            libpq-dev

      - name: Resource preflight
        shell: bash
        run: |
          set -euxo pipefail
          nproc
          free -h
          df -h / /tmp
          gcc --version
          cmake --version
          ninja --version

      - name: Configure
        run: ./scripts/run-ci-linux.sh configure

      - name: Build
        run: ./scripts/run-ci-linux.sh build

      - name: Full test suite
        run: ./scripts/run-ci-linux.sh test

      - name: Timer lifecycle stress 20x
        shell: bash
        run: |
          set -euxo pipefail
          for i in $(seq 1 20); do
            echo "ARM64 timer stress iteration ${i}/20"
            "$BUILD_DIR/bin/test_utl_timer"
          done

      - name: Install and downstream consumer check
        run: ./scripts/run-ci-linux.sh install-consumer

      - name: Performance smoke
        run: ./scripts/run-ci-linux.sh perf

      - name: Resource snapshot
        if: always()
        shell: bash
        run: |
          set -u
          echo '=== uname ==='
          uname -a || true
          echo '=== memory ==='
          free -h || true
          echo '=== swap ==='
          swapon --show || true
          echo '=== disk ==='
          df -h / /tmp || true
          echo '=== load ==='
          uptime || true
          echo '=== build size ==='
          du -sh "$BUILD_DIR" 2>/dev/null || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-failure-logs-arm64
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: ignore
