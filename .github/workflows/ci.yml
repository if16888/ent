name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev default-libmysqlclient-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENT_ENABLE_SQLITE=ON \
            -DENT_ENABLE_MYSQL=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Performance Smoke
        run: |
          ./build/bin/perf_utl_socket
          ./build/bin/perf_utl_timer
          ./build/bin/perf_utl_timer_rt
          ./build/bin/perf_utl_tpool

  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DENT_ENABLE_SQLITE=ON `
            -DENT_ENABLE_MYSQL=ON `
            -DENT_ALLOW_VENDORED_DB_LIBS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: >
          ctest --test-dir build -C Release --output-on-failure
          -R "test_ent_init|test_utl_dll|test_utl_thread|test_ent_thread|test_utl_tpool|test_utl_timer|test_utl_socket|test_ent_db|test_ent_log|test_security"

      - name: Performance Smoke
        shell: pwsh
        run: |
          & ".\build\bin\Release\perf_utl_timer.exe"
          & ".\build\bin\Release\perf_utl_tpool.exe"
