name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    env:
      BUILD_DIR: build
      CI_LOG_DIR: ${{ runner.temp }}/ci-logs/linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev default-libmysqlclient-dev libpq-dev

      - name: Configure
        run: ./scripts/run-ci-linux.sh configure

      - name: Build
        run: ./scripts/run-ci-linux.sh build

      - name: Test
        run: ./scripts/run-ci-linux.sh test

      - name: Install and downstream consumer check
        run: ./scripts/run-ci-linux.sh install-consumer

      - name: Performance Smoke
        run: ./scripts/run-ci-linux.sh perf

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs-linux
          path: ${{ runner.temp }}/ci-logs/linux
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: win32
            platform: Win32
            triplet: x86-windows
          - arch: x64
            platform: x64
            triplet: x64-windows
    env:
      BUILD_DIR: build-${{ matrix.arch }}
      WINDOWS_CMAKE_PLATFORM: ${{ matrix.platform }}
      VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
      CI_LOG_DIR: ${{ runner.temp }}/ci-logs/${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg downloads and binary packages
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\downloads
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-

      - name: Configure
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 configure

      - name: Build
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 build

      - name: Run log tests (Windows explicit)
        shell: pwsh
        run: |
          $logDir = $env:CI_LOG_DIR
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          Push-Location $env:BUILD_DIR
          try {
            ctest -C Release --output-on-failure -R "^(test_ent_log|test_ent_log_flush_deadline)$" *>&1 | Tee-Object -FilePath (Join-Path $logDir "explicit-log-tests.log")
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          finally {
            Pop-Location
          }

      - name: Test
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 test

      - name: Install and downstream consumer check
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 install-consumer

      - name: Performance Smoke
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 perf

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/ci-logs/${{ matrix.arch }}
          if-no-files-found: ignore
