name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    env:
      BUILD_DIR: build
      CI_LOG_DIR: ${{ github.workspace }}/ci-logs/linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev default-libmysqlclient-dev libpq-dev

      - name: Configure
        run: ./scripts/run-ci-linux.sh configure

      - name: Build
        run: ./scripts/run-ci-linux.sh build

      - name: Test
        run: ./scripts/run-ci-linux.sh test

      - name: Install and downstream consumer check
        run: ./scripts/run-ci-linux.sh install-consumer

      - name: Performance Smoke
        run: ./scripts/run-ci-linux.sh perf

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs-linux
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: ignore

  sanitizer-asan-ubsan:
    name: Linux ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_DIR: build-asan-ubsan
      CI_LOG_DIR: ${{ github.workspace }}/ci-logs/asan-ubsan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev default-libmysqlclient-dev libpq-dev

      - name: Configure sanitizer build
        run: >-
          cmake -S . -B "$BUILD_DIR" -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Run lifecycle tests
        run: mkdir -p "$CI_LOG_DIR"

      - name: Execute lifecycle tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:log_path=${{ github.workspace }}/ci-logs/asan-ubsan/asan
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:log_path=${{ github.workspace }}/ci-logs/asan-ubsan/ubsan
        run: >-
          ctest --test-dir "$BUILD_DIR" --output-on-failure
          -R "^(test_ent_init|test_ent_init_concurrency|test_ent_log|test_ent_db|test_ent_thread|test_security)$"

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-logs-asan-ubsan
          path: |
            ${{ env.CI_LOG_DIR }}
            ${{ env.BUILD_DIR }}/Testing/Temporary
          if-no-files-found: ignore

  sanitizer-tsan:
    name: Linux TSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_DIR: build-tsan
      CI_LOG_DIR: ${{ github.workspace }}/ci-logs/tsan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev default-libmysqlclient-dev libpq-dev

      - name: Configure sanitizer build
        run: >-
          cmake -S . -B "$BUILD_DIR" -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Run concurrency tests
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:history_size=7:log_path=${{ github.workspace }}/ci-logs/tsan/tsan
        run: >-
          mkdir -p "$CI_LOG_DIR" &&
          ctest --test-dir "$BUILD_DIR" --output-on-failure
          -R "^(test_ent_init_concurrency|test_ent_log|test_ent_db|test_ent_thread|test_utl_tpool_integration)$"

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-logs-tsan
          path: |
            ${{ env.CI_LOG_DIR }}
            ${{ env.BUILD_DIR }}/Testing/Temporary
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: win32
            platform: Win32
            triplet: x86-windows
          - arch: x64
            platform: x64
            triplet: x64-windows
    env:
      BUILD_DIR: build-${{ matrix.arch }}
      WINDOWS_CMAKE_PLATFORM: ${{ matrix.platform }}
      VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
      CI_LOG_DIR: ${{ github.workspace }}/ci-logs/${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg downloads and binary packages
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\downloads
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-

      - name: Configure
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 configure

      - name: Build
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 build

      - name: Run log tests (Windows explicit)
        shell: pwsh
        run: |
          $logDir = $env:CI_LOG_DIR
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          Push-Location $env:BUILD_DIR
          try {
            ctest -C Release --output-on-failure -R "^(test_ent_log|test_ent_log_flush_deadline)$" *>&1 | Tee-Object -FilePath (Join-Path $logDir "explicit-log-tests.log")
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          finally {
            Pop-Location
          }

      - name: Test
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 test

      - name: Install and downstream consumer check
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 install-consumer

      - name: Performance Smoke
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 perf

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs-${{ matrix.arch }}
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: ignore
