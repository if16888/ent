name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev default-libmysqlclient-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENT_ENABLE_SQLITE=ON \
            -DENT_ENABLE_MYSQL=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cpack --config build/CPackConfig.cmake -B build/package

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: build/package/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_CACHE_DIR: ${{ github.workspace }}\.vcpkg-bincache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_INSTALLATION_ROOT }}\downloads
          key: vcpkg-downloads-${{ runner.os }}-x64-windows-${{ hashFiles('.github/workflows/ci.yml', '.github/workflows/release.yml', 'CMakeLists.txt', 'comm/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-x64-windows-

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE_DIR }}
          key: vcpkg-bincache-${{ runner.os }}-x64-windows-${{ hashFiles('.github/workflows/ci.yml', '.github/workflows/release.yml', 'CMakeLists.txt', 'comm/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-x64-windows-

      - name: Install vcpkg dependencies
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ env.VCPKG_BINARY_CACHE_DIR }},readwrite
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-windows libmysql:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DENT_ENABLE_SQLITE=ON `
            -DENT_ENABLE_MYSQL=ON `
            -DENT_ALLOW_VENDORED_DB_LIBS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: >
          ctest --test-dir build -C Release --output-on-failure
          -R "test_ent_init|test_utl_dll|test_utl_thread|test_ent_thread|test_utl_timer|test_ent_log"

      - name: Package
        run: cpack -C Release --config build/CPackConfig.cmake -B build/package

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: build/package/*
          if-no-files-found: error
