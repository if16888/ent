name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    env:
      BUILD_DIR: build

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev default-libmysqlclient-dev libpq-dev

      - name: Validate public source boundary
        run: python3 scripts/check_public_scope.py --root .

      - name: Configure
        run: ./scripts/run-ci-linux.sh configure

      - name: Build
        run: ./scripts/run-ci-linux.sh build

      - name: Test
        run: ./scripts/run-ci-linux.sh test

      - name: Install and downstream consumer check
        run: ./scripts/run-ci-linux.sh install-consumer

      - name: Performance Smoke
        run: ./scripts/run-ci-linux.sh perf

      - name: Package runtime and devel SDKs
        run: |
          rm -rf build/package-runtime build/package-devel
          cmake --install build --prefix build/package-runtime --component runtime
          cmake --install build --prefix build/package-devel --component runtime
          cmake --install build --prefix build/package-devel --component devel
          cp LICENSE NOTICE THIRD_PARTY_NOTICES build/package-runtime/
          cp LICENSE NOTICE THIRD_PARTY_NOTICES build/package-devel/

          python3 scripts/check_public_scope.py --root build/package-runtime
          python3 scripts/check_public_scope.py --root build/package-devel

          forbidden_runtime="$(find build/package-runtime build/package-devel -type f \
            \( -name 'libmariadb.so*' \
               -o -name 'libmysqlclient.so*' \
               -o -name 'libpq.so*' \) -print)"
          if [[ -n "${forbidden_runtime}" ]]; then
            printf '%s\n' "${forbidden_runtime}"
            echo "Non-redistributable database runtime detected in release package" >&2
            exit 1
          fi

          tar -C build/package-runtime -czf ent-${GITHUB_REF_NAME}-linux-x86_64-runtime.tar.gz .
          tar -C build/package-devel -czf ent-${GITHUB_REF_NAME}-linux-x86_64-devel.tar.gz .

      - name: Validate extracted devel SDK
        run: |
          ./scripts/validate-release-sdk.sh \
            "ent-${GITHUB_REF_NAME}-linux-x86_64-devel.tar.gz" \
            "${GITHUB_WORKSPACE}/test/downstream_consumer"

      - name: Upload runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-runtime
          path: ent-${{ github.ref_name }}-linux-x86_64-runtime.tar.gz
          if-no-files-found: error

      - name: Upload devel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-devel
          path: ent-${{ github.ref_name }}-linux-x86_64-devel.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: win32
            platform: Win32
            triplet: x86-windows
          - arch: x64
            platform: x64
            triplet: x64-windows
    env:
      BUILD_DIR: build-${{ matrix.arch }}
      WINDOWS_CMAKE_PLATFORM: ${{ matrix.platform }}
      VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Cache vcpkg downloads and binary packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            C:\vcpkg\downloads
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-

      - name: Validate public source boundary
        shell: pwsh
        run: python .\scripts\check_public_scope.py --root .

      - name: Configure
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 configure

      - name: Build
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 build

      - name: Run log tests (Windows explicit)
        shell: pwsh
        run: |
          Push-Location $env:BUILD_DIR
          try {
            ctest -C Release --output-on-failure -R "^(test_ent_log|test_ent_log_flush_deadline)$"
          }
          finally {
            Pop-Location
          }

      - name: Test
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 test

      - name: Install and downstream consumer check
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 install-consumer

      - name: Performance Smoke
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 perf

      - name: Package runtime and devel SDKs
        shell: pwsh
        run: |
          $RuntimePackage = Join-Path $env:BUILD_DIR "package-runtime"
          $DevelPackage = Join-Path $env:BUILD_DIR "package-devel"
          if (Test-Path $RuntimePackage) { Remove-Item $RuntimePackage -Recurse -Force }
          if (Test-Path $DevelPackage) { Remove-Item $DevelPackage -Recurse -Force }
          cmake --install $env:BUILD_DIR --config Release --prefix $RuntimePackage --component runtime
          cmake --install $env:BUILD_DIR --config Release --prefix $DevelPackage --component runtime
          cmake --install $env:BUILD_DIR --config Release --prefix $DevelPackage --component devel
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_NOTICES -Destination $RuntimePackage
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_NOTICES -Destination $DevelPackage

          python .\scripts\check_public_scope.py --root $RuntimePackage
          if ($LASTEXITCODE -ne 0) { throw "Runtime public-scope validation failed" }
          python .\scripts\check_public_scope.py --root $DevelPackage
          if ($LASTEXITCODE -ne 0) { throw "Devel SDK public-scope validation failed" }

          $PackageRoots = @($RuntimePackage, $DevelPackage)
          $ForbiddenRuntime = foreach ($Root in $PackageRoots) {
            Get-ChildItem -LiteralPath $Root -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^(libmariadb|mariadb|libmysql|mysql|libpq)\.dll$' }
          }
          if ($ForbiddenRuntime) {
            $ForbiddenRuntime | Select-Object -ExpandProperty FullName
            throw "Non-redistributable database runtime detected in release package"
          }

          Compress-Archive -Path "$RuntimePackage\*" -DestinationPath ent-${env:GITHUB_REF_NAME}-windows-${{ matrix.arch }}-runtime.zip -Force
          Compress-Archive -Path "$DevelPackage\*" -DestinationPath ent-${env:GITHUB_REF_NAME}-windows-${{ matrix.arch }}-devel.zip -Force

      - name: Validate extracted devel SDK
        shell: pwsh
        run: |
          .\scripts\validate-release-sdk.ps1 `
            -Archive "ent-${env:GITHUB_REF_NAME}-windows-${{ matrix.arch }}-devel.zip" `
            -ConsumerSource "$env:GITHUB_WORKSPACE\test\downstream_consumer" `
            -Platform "${{ matrix.platform }}" `
            -Triplet "${{ matrix.triplet }}" `
            -ToolchainFile "C:\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Upload runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-${{ matrix.arch }}-runtime
          path: ent-${{ github.ref_name }}-windows-${{ matrix.arch }}-runtime.zip
          if-no-files-found: error

      - name: Upload devel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-${{ matrix.arch }}-devel
          path: ent-${{ github.ref_name }}-windows-${{ matrix.arch }}-devel.zip
          if-no-files-found: error

  publish:
    runs-on: ubuntu-24.04
    needs:
      - build-linux
      - build-windows

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-rc') }}
