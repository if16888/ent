name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    env:
      BUILD_DIR: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev default-libmysqlclient-dev

      - name: Configure
        run: ./scripts/run-ci-linux.sh configure

      - name: Build
        run: ./scripts/run-ci-linux.sh build

      - name: Test
        run: ./scripts/run-ci-linux.sh test

      - name: Install and downstream consumer check
        run: ./scripts/run-ci-linux.sh install-consumer

      - name: Performance Smoke
        run: ./scripts/run-ci-linux.sh perf

      - name: Package SDK
        run: |
          cmake --install build --prefix build/package-root
          tar -C build/package-root -czf ent-${GITHUB_REF_NAME}-linux-x86_64-sdk.tar.gz .

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-sdk
          path: ent-${{ github.ref_name }}-linux-x86_64-sdk.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    env:
      BUILD_DIR: build
      WINDOWS_CMAKE_PLATFORM: Win32
      WINDOWS_DISABLE_PGSQL: ON

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 configure

      - name: Build
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 build

      - name: Test
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 test

      - name: Install and downstream consumer check
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 install-consumer

      - name: Performance Smoke
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 perf

      - name: Package SDK
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix build/package-root
          Compress-Archive -Path build/package-root\* -DestinationPath ent-${env:GITHUB_REF_NAME}-windows-win32-sdk.zip -Force

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-sdk
          path: ent-${{ github.ref_name }}-windows-win32-sdk.zip
          if-no-files-found: error

  publish:
    runs-on: ubuntu-24.04
    needs:
      - build-linux
      - build-windows

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
