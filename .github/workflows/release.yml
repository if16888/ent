name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    env:
      BUILD_DIR: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev default-libmysqlclient-dev

      - name: Configure
        run: ./scripts/run-ci-linux.sh configure

      - name: Build
        run: ./scripts/run-ci-linux.sh build

      - name: Test
        run: ./scripts/run-ci-linux.sh test

      - name: Install and downstream consumer check
        run: ./scripts/run-ci-linux.sh install-consumer

      - name: Performance Smoke
        run: ./scripts/run-ci-linux.sh perf

      - name: Package runtime and devel SDKs
        run: |
          rm -rf build/package-runtime build/package-devel
          cmake --install build --prefix build/package-runtime --component runtime
          cmake --install build --prefix build/package-devel --component devel
          tar -C build/package-runtime -czf ent-${GITHUB_REF_NAME}-linux-x86_64-runtime.tar.gz .
          tar -C build/package-devel -czf ent-${GITHUB_REF_NAME}-linux-x86_64-devel.tar.gz .

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-runtime
          path: ent-${{ github.ref_name }}-linux-x86_64-runtime.tar.gz
          if-no-files-found: error

      - name: Upload devel artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-devel
          path: ent-${{ github.ref_name }}-linux-x86_64-devel.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    env:
      BUILD_DIR: build
      WINDOWS_CMAKE_PLATFORM: Win32
      WINDOWS_DISABLE_PGSQL: ON

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 configure

      - name: Build
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 build

      - name: Test
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 test

      - name: Install and downstream consumer check
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 install-consumer

      - name: Performance Smoke
        shell: pwsh
        run: .\scripts\run-ci-windows.ps1 perf

      - name: Package runtime and devel SDKs
        shell: pwsh
        run: |
          if (Test-Path build/package-runtime) { Remove-Item build/package-runtime -Recurse -Force }
          if (Test-Path build/package-devel) { Remove-Item build/package-devel -Recurse -Force }
          cmake --install build --config Release --prefix build/package-runtime --component runtime
          cmake --install build --config Release --prefix build/package-devel --component devel
          Compress-Archive -Path build/package-runtime\* -DestinationPath ent-${env:GITHUB_REF_NAME}-windows-win32-runtime.zip -Force
          Compress-Archive -Path build/package-devel\* -DestinationPath ent-${env:GITHUB_REF_NAME}-windows-win32-devel.zip -Force

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-runtime
          path: ent-${{ github.ref_name }}-windows-win32-runtime.zip
          if-no-files-found: error

      - name: Upload devel artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-devel
          path: ent-${{ github.ref_name }}-windows-win32-devel.zip
          if-no-files-found: error

  publish:
    runs-on: ubuntu-24.04
    needs:
      - build-linux
      - build-windows

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
