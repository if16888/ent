name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev default-libmysqlclient-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENT_ENABLE_SQLITE=ON \
            -DENT_ENABLE_MYSQL=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cpack --config build/CPackConfig.cmake -B build/package

      - name: Upload package bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-packages
          path: build/package/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-windows libmysql:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DENT_ENABLE_SQLITE=ON `
            -DENT_ENABLE_MYSQL=ON `
            -DENT_ALLOW_VENDORED_DB_LIBS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: >
          ctest --test-dir build -C Release --output-on-failure
          -R "test_ent_init|test_utl_dll|test_utl_thread|test_ent_thread|test_utl_timer|test_ent_log"

      - name: Package
        run: cpack -C Release --config build/CPackConfig.cmake -B build/package

      - name: Upload package bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-packages
          path: build/package/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-24.04
    needs:
      - build-linux
      - build-windows

    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
