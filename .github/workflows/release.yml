name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev default-libmysqlclient-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENT_ENABLE_SQLITE=ON \
            -DENT_ENABLE_MYSQL=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Performance Smoke
        run: |
          ./build/bin/perf_utl_socket
          ./build/bin/perf_utl_timer
          ./build/bin/perf_utl_timer_rt
          ./build/bin/perf_utl_tpool
          ./build/bin/perf_ent_log

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-build
          path: |
            build/bin/*
            build/lib/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DENT_ENABLE_SQLITE=ON `
            -DENT_ENABLE_MYSQL=ON `
            -DENT_ALLOW_VENDORED_DB_LIBS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: >
          ctest --test-dir build -C Release --output-on-failure
          -R "test_ent_init|test_utl_dll|test_utl_thread|test_ent_thread|test_utl_tpool|test_utl_timer|test_utl_socket|test_ent_db|test_ent_log|test_security"

      - name: Performance Smoke
        shell: pwsh
        run: |
          & ".\build\bin\Release\perf_utl_timer.exe"
          & ".\build\bin\Release\perf_utl_tpool.exe"
          & ".\build\bin\Release\perf_ent_log.exe"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-build
          path: |
            build/bin/Release/*
            build/lib/Release/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-24.04
    needs:
      - build-linux
      - build-windows

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
