name: Public Scope

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate public repository boundary
        run: python3 scripts/check_public_scope.py --root .
      - name: Run public-scope checker regressions
        run: python3 scripts/check_public_scope.py --self-test
