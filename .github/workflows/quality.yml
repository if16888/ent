name: Core Quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.mode }} (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: warnings
            compiler: gcc
          - mode: warnings
            compiler: clang
          - mode: analyze
            compiler: gcc
          - mode: coverage
            compiler: gcc
          - mode: abi
            compiler: gcc
          - mode: sdk
            compiler: gcc
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
      QUALITY_DIR: ${{ github.workspace }}/build-quality
      CC: ${{ matrix.compiler || 'gcc' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev abigail-tools gcovr clang
      - name: Run quality gate
        run: bash scripts/run-quality-linux.sh "${{ matrix.mode }}" "$BASE_REF"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-${{ matrix.mode }}-${{ matrix.compiler || 'gcc' }}
          path: |
            build-quality/*.log
            build-quality/*.json
            build-quality/*.xml
            build-quality/*.html
            build-quality/*.css
            build-quality/*.txt
            build-quality/coverage/Testing/Temporary
          if-no-files-found: error
  windows-warnings:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Compare MSVC W4 warnings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force build-quality/base-source | Out-Null
          git archive $env:BASE_REF --output=build-quality/base.tar
          if ($LASTEXITCODE -ne 0) { throw "baseline archive failed" }
          tar -xf build-quality/base.tar -C build-quality/base-source
          if ($LASTEXITCODE -ne 0) { throw "baseline extraction failed" }
          foreach ($Name in @("base", "current")) {
            $Source = if ($Name -eq "base") { "build-quality/base-source" } else { "." }
            $Build = "build-quality/$Name-warnings"
            cmake -S $Source -B $Build -A x64 -DBUILD_TESTING=OFF -DENT_BUILD_EXAMPLES=OFF `
              -DENT_ENABLE_SQLITE=OFF -DENT_ENABLE_MYSQL=OFF -DENT_ENABLE_PGSQL=OFF `
              -DENT_ENABLE_LUA=OFF -DCMAKE_C_FLAGS="/DWIN32 /D_WINDOWS /W4"
            if ($LASTEXITCODE -ne 0) { throw "$Name configure failed" }
            cmake --build $Build --clean-first --config Release --target ent ent_s `
              *>&1 | Tee-Object -FilePath "build-quality/$Name-warnings.log"
            if ($LASTEXITCODE -ne 0) { throw "$Name build failed" }
          }
          python scripts/check-diagnostics.py build-quality/base-warnings.log `
            build-quality/current-warnings.log --output build-quality/warnings-msvc.json
          if ($LASTEXITCODE -ne 0) { throw "new MSVC warnings" }
      - name: Validate relocated Windows SDK consumers
        shell: pwsh
        run: |
          cmake --install build-quality/current-warnings --config Release --prefix build-quality/sdk
          if ($LASTEXITCODE -ne 0) { throw "SDK install failed" }
          Compress-Archive -Path build-quality/sdk/* -DestinationPath build-quality/sdk.zip
          ./scripts/validate-release-sdk.ps1 -Archive build-quality/sdk.zip `
            -ConsumerSource "$env:GITHUB_WORKSPACE/test/downstream_consumer" -Platform x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: quality-warnings-msvc
          path: |
            build-quality/*.log
            build-quality/*.json
          if-no-files-found: error
  parser-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: python3 scripts/fuzz-msg-parser.py --iterations 10000 --output parser-fuzz.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: parser-fuzz
          path: |
            parser-fuzz.json
            msg-fuzz-failure.msg
          if-no-files-found: error
  db-resources:
    name: Database resource boundaries (live services)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable_test_password
          MYSQL_DATABASE: ent_test
          MYSQL_USER: ent_test
          MYSQL_PASSWORD: disposable_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable_test_password"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ent_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: ent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ent_test -d ent_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      ENT_MYSQL_HOST: 127.0.0.1
      ENT_MYSQL_DB: ent_test
      ENT_MYSQL_USER: ent_test
      ENT_MYSQL_PASSWORD: disposable_test_password
      ENT_MYSQL_PORT: "3306"
      ENT_PGSQL_HOST: 127.0.0.1
      ENT_PGSQL_DB: ent_test
      ENT_PGSQL_USER: ent_test
      ENT_PGSQL_PASSWORD: disposable_test_password
      ENT_PGSQL_PORT: "5432"
      ENT_DB_REQUIRE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install clients
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev default-libmysqlclient-dev libpq-dev
      - name: Build and test boundaries
        run: |
          cmake -S . -B build-db-resources -DCMAKE_BUILD_TYPE=Debug -DENT_BUILD_EXAMPLES=OFF
          cmake --build build-db-resources --target test_ent_db_limits_live --parallel 2
          ctest --test-dir build-db-resources --output-on-failure -R '^test_ent_db_limits_live$'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: db-resource-boundaries
          path: build-db-resources/Testing/Temporary
          if-no-files-found: warn
